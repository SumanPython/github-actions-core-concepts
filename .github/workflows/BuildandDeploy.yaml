name: Build-and-Deploy
on: workflow_dispatch
env:
                CONTAINER_REGISTRY: docker.io
                IMAGE_NAME: app
jobs:
    docker-job:        
        runs-on: ubuntu-latest
        steps:
            - name: Build the image              
              run: echo docker build . -t $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$IMAGE_NAME

            - name: login
              run: echo docker login --username=${{ vars.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}

            - name: Push the image
              run: echo docker push $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$IMAGE_NAME

    deploy-job:
        needs: docker-job
        runs-on: ubuntu-latest
        steps:
            - name: Run the app
              run: echo docker run $CONTAINER_REGISTRY/${{ vars.DOCKER_USERNAME }}/$IMAGE_NAME