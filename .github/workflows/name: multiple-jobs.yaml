name: multiple-jobs
on: push
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: build the app
        run: |
          sleep 3
          echo "building the app" >app.txt
        
  test-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: Test the app
        run: |
          sleep 3
          cat app.txt
          echo "Testing the app" >> app.txt

  deploy-job:
    needs: test-job
    runs-on: ubuntu-latest
    steps:
      - name: deploy the app
        run: |
          sleep 3
          cat app.txt
          echo "deploying the app" >> app.txt

  