name: multiple-jobs
on: push
jobs:
    build-job:
        runs-on: ubuntu-latest
        steps:
            - name: building a file
              run: echo "SumanCloeh" > app.txt
            - name: uploading file
              uses: actions/upload-artifact@v4
              with:
                name: Thefile
                path: app.txt
    
    test-job:
        needs: build-job
        runs-on: ubuntu-latest
        steps:
            - name: downloading file
              uses: actions/download-artifact@v4
              with:
                name: Thefile
            - name: testing a file
              run: cat app.txt
            
    deploy-job:
        needs: test-job
        runs-on: ubuntu-latest
        steps:
            - name: downloading file
              uses: actions/download-artifact@v4
              with:
                name: Thefile
            - name: deploying a file
              run: cat app.txt